<title>Tracker REMAEDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;600;700&family=Lato:wght@400;700&family=Alex+Brush&display=swap">
<style>
:root{
  --bg:#fbfaf4;--surface:#ffffff;--surface2:#f2f6ea;--ink:#1e352b;--muted:#61796c;--line:#dfe6d8;
  --accent:#008038;--accent-ink:#ffffff;--soft:#e8f7d1;--bright:#7dd957;--forest:#294f42;
  --warn:#e07400;--warn-soft:#fff1de;--pink:#f5e0de;--sun:#ffcf1f;--cream:#fff7de;
  --shadow:0 6px 20px rgba(41,79,66,.08);
  --logo-a:#7dd957;--logo-b:#008038;
  --display:"League Spartan","Trebuchet MS",Arial,sans-serif;
  --body:"Lato","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121f1a;--surface:#1b2c25;--surface2:#213630;--ink:#eef5ea;--muted:#9fb7aa;--line:#2f463c;
    --accent:#7dd957;--accent-ink:#0f2418;--soft:#23432f;--bright:#7dd957;--forest:#cfe6c2;
    --warn:#ffa24d;--warn-soft:#3a2a18;--pink:#4a3a38;--sun:#ffd84d;--cream:#2a3a2f;
    --shadow:0 6px 20px rgba(0,0,0,.35);
    --logo-a:#eef5ea;--logo-b:#eef5ea;
  }
}
:root[data-theme="dark"]{
  --bg:#121f1a;--surface:#1b2c25;--surface2:#213630;--ink:#eef5ea;--muted:#9fb7aa;--line:#2f463c;
  --accent:#7dd957;--accent-ink:#0f2418;--soft:#23432f;--bright:#7dd957;--forest:#cfe6c2;
  --warn:#ffa24d;--warn-soft:#3a2a18;--pink:#4a3a38;--sun:#ffd84d;--cream:#2a3a2f;
  --shadow:0 6px 20px rgba(0,0,0,.35);
  --logo-a:#eef5ea;--logo-b:#eef5ea;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--bright);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:.005em}
h1{font-size:1.7rem;font-weight:700}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 110px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--display);font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:inline-flex;flex-direction:column;align-items:center;line-height:1;text-decoration:none}
.logo .wm{font-family:var(--display);font-weight:400;font-size:1.05rem;letter-spacing:.32em;color:var(--logo-a);padding-left:.32em}
.logo .wm .ae{color:var(--logo-b)}
.logo .sig{font-family:"Alex Brush","Brush Script MT",cursive;font-size:1.3rem;color:var(--logo-b);margin-top:-3px;letter-spacing:.02em}
.logo.big .wm{font-size:1.9rem}
.logo.big .sig{font-size:2.3rem;margin-top:-6px}
.logo img{display:block;max-height:44px;width:auto}
.logo.big img{max-height:96px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.soft{background:var(--soft);border-color:transparent}
.card.demo{background:var(--cream);border-color:transparent;flex-direction:row;align-items:center;gap:12px;padding:12px 14px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:999px;font-weight:700;font-family:var(--display);letter-spacing:.02em;border:1.5px solid var(--accent);color:var(--accent);background:transparent;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:var(--line);color:var(--ink)}
.btn.danger{border-color:transparent;color:var(--warn)}
.btn.sm{padding:7px 12px;min-height:34px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* header du jour */
.dayhead{display:flex;align-items:center;gap:12px}
.ring{width:72px;height:72px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);font-size:.78rem;font-weight:700;font-family:var(--display);letter-spacing:.03em;white-space:nowrap}
.chip.ok{background:var(--soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.lock{background:var(--surface2);color:var(--muted)}

/* ressenti */
.scale{display:flex;flex-direction:column;gap:6px}
.scale .dots{display:flex;gap:8px}
.dot{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:600;transition:transform .12s}
.dot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot:active{transform:scale(.95)}
.scale .ends{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}

/* habitudes */
.pilier{display:flex;flex-direction:column;gap:8px}
.pilier .ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:4px 2px 0}
.pilier .ph .sub{font-size:.78rem;color:var(--muted)}
.hab{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-height:52px}
.hab .box{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface)}
.hab .box svg{width:14px;height:14px;stroke:var(--accent-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.hab.done{background:var(--soft);border-color:transparent}
.hab.done .box{background:var(--accent);border-color:var(--accent)}
.hab.done .box svg{opacity:1}
.hab.done .lbl{color:var(--forest)}
.hab .lbl{flex:1;min-width:0;font-weight:400}
.hab .lbl b{display:block;font-size:.72rem;color:var(--muted);font-weight:400;margin-top:2px}
.hab.socle .box{border-color:var(--bright)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-family:var(--display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1}
.tile .v small{font-size:.9rem;font-weight:600;color:var(--muted)}

/* grille semaine */
.wgrid{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,30px);gap:6px 4px;align-items:center}
.wgrid .hd{text-align:center;font-family:var(--display);font-size:.72rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.wgrid .hd.today{color:var(--accent)}
.wgrid .hd .bar{width:18px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.wgrid .hd .bar i{display:block;height:100%;background:var(--accent)}
.wgrid .lab{font-size:.8rem;line-height:1.2;padding-right:4px;overflow-wrap:anywhere}
.wgrid .c{width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.wgrid .c i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.wgrid .c.on i{background:var(--accent);width:18px;height:18px}
.wgrid .c.future i{background:transparent;border:1.5px dashed var(--line)}
.wgrid .sep{grid-column:1/-1;height:1px;background:var(--line);margin:2px 0}

/* charts */
.charts{display:flex;flex-direction:column;gap:10px}
.chart{display:flex;flex-direction:column;gap:4px}
.chart .ch{display:flex;justify-content:space-between;align-items:baseline}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font-size:9px;font-family:var(--body)}
.chart .line{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart .pt{stroke:var(--surface);stroke-width:2}
.chart .last{fill:var(--ink);font-family:var(--display);font-weight:700;font-size:11px}
.chart .area{opacity:.12}

/* parcours */
.progress{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--bright));border-radius:5px}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phase{border-radius:12px;padding:10px;background:var(--surface2);font-size:.8rem;display:flex;flex-direction:column;gap:2px}
.phase.now{background:var(--soft);color:var(--forest)}
.phase.past{opacity:.7}
.phase b{font-family:var(--display);font-size:.9rem}
.victoire{padding:10px 12px;border-radius:12px;background:var(--surface2);display:flex;gap:10px;align-items:flex-start}
.victoire .d{font-family:var(--display);font-weight:600;font-size:.75rem;color:var(--muted);white-space:nowrap;padding-top:2px;min-width:52px}

/* repas */
.meals{display:flex;flex-direction:column;gap:10px}
.meal{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start}
.meal label{font-family:var(--display);font-weight:600;font-size:.8rem;color:var(--muted);padding-top:12px;letter-spacing:.04em}
.meal textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);resize:none;line-height:1.35;font-family:var(--body)}
.mealday{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--surface2)}
.mealday .d{font-family:var(--display);font-weight:600;font-size:.78rem;color:var(--muted)}
.mealday .l{font-size:.88rem}
.mealday .l b{font-weight:700;color:var(--muted);font-size:.78rem;font-family:var(--display);letter-spacing:.04em}

/* formulaires */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.8rem;font-weight:700;color:var(--muted)}
.input{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);min-height:44px}
textarea.input{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:.78rem;resize:vertical}
.toggle{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle .sw{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.toggle.on .sw{background:var(--accent)}
.toggle.on .sw::after{left:21px}
.toggle:disabled{opacity:.55;cursor:default}
.toggle .t{flex:1;min-width:0}
.toggle .t b{display:block;font-size:.72rem;color:var(--muted);font-weight:400}
.sos{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--pink)}
.sos .btn{border-color:var(--forest);color:var(--forest)}

/* navigation */
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;font-family:var(--display);font-size:.7rem;font-weight:600;letter-spacing:.04em;color:var(--muted)}
#nav button.on{color:var(--accent)}
#nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--forest);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:.85rem;box-shadow:var(--shadow);z-index:6;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{color:#0f2418}}
:root[data-theme="dark"] .toast{color:#0f2418}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div id="app" class="wrap"></div>
<nav id="nav" aria-label="Navigation"><div class="in"></div></nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Référentiel ---------- */
const KEY='remaede-tracker-v1';
const PILIERS={
  E:{nom:'Rééquilibrer',sub:'Métabolisme, glycémie, énergie'},
  A:{nom:'Apaiser',sub:'Sommeil et système nerveux'},
  S:{nom:'Assainir',sub:'Environnement du quotidien'},
  R:{nom:'Rayonner',sub:'Image de soi et longévité'}
};
/* f = fréquence : d quotidien, w hebdo (n fois), mo mensuel (n fois). m = mois de déblocage de l'option. */
const HABITS=[
  {id:'pdj',p:'E',l:'Petit-déjeuner protéiné',f:'d',socle:true},
  {id:'proto',p:'E',l:'Protocole micronutrition du jour',f:'d',socle:true},
  {id:'assiette',p:'E',l:'Légumes et protéines à chaque repas',f:'d',socle:true},
  {id:'coucher',p:'A',l:'Coucher dans ma fenêtre horaire',f:'d',socle:true},
  {id:'ecrans',p:'A',l:'Écrans coupés une heure avant le coucher',f:'d',socle:true},
  {id:'respi',p:'A',l:'5 minutes de respiration ou de cohérence cardiaque',f:'d',socle:true},
  {id:'aerer',p:'S',l:'Aérer 10 minutes matin et soir',f:'d',socle:true},
  {id:'geste',p:'R',l:'Un geste pour moi aujourd’hui',f:'d',socle:true},

  {id:'eau',p:'E',l:'Boire 1,5 L d’eau',f:'d',m:1},
  {id:'grignot',p:'E',l:'Zéro grignotage sucré entre les repas',f:'d',m:1},
  {id:'plan30',p:'E',l:'Suivre le plan alimentaire 30 jours',f:'d',m:1},
  {id:'marche10',p:'E',l:'Marcher 10 minutes après un repas',f:'d',m:2},
  {id:'bouger',p:'E',l:'Bouger 30 minutes',f:'d',m:2},
  {id:'renfo',p:'E',l:'Séance de renforcement musculaire',f:'w',n:2,m:2},
  {id:'alcool',p:'E',l:'Pas d’alcool aujourd’hui',f:'d',m:3},

  {id:'cafe',p:'A',l:'Pas de café ni de thé après 14 h',f:'d',m:1},
  {id:'diner',p:'A',l:'Dîner terminé avant 20 h',f:'d',m:1},
  {id:'lumiere',p:'A',l:'10 minutes de lumière du jour le matin',f:'d',m:1},
  {id:'routine',p:'A',l:'Routine matinale énergisante 15 minutes',f:'d',m:1},
  {id:'pauses',p:'A',l:'Trois micro-pauses respiration dans la journée',f:'d',m:2},
  {id:'papier',p:'A',l:'Vider ma tête sur papier avant de dormir',f:'d',m:2},
  {id:'chambre',p:'A',l:'Chambre fraîche, sombre et aérée ce soir',f:'d',m:2},
  {id:'sieste',p:'A',l:'Sieste de 20 minutes maximum si besoin',f:'d',m:3},

  {id:'plastique',p:'S',l:'Aucun plastique chauffé aujourd’hui',f:'d',m:1},
  {id:'verre',p:'S',l:'Boire dans du verre ou de l’inox',f:'d',m:1},
  {id:'cuisson',p:'S',l:'Cuisson douce privilégiée',f:'d',m:2},
  {id:'cosmeto',p:'S',l:'Un cosmétique remplacé par une alternative plus saine',f:'w',n:1,m:2},
  {id:'entretien',p:'S',l:'Un produit d’entretien remplacé',f:'mo',n:1,m:3},

  {id:'miroir',p:'R',l:'Une phrase bienveillante devant le miroir',f:'d',m:1},
  {id:'plaisir',p:'R',l:'Une activité plaisir rien que pour moi',f:'w',n:1,m:1},
  {id:'qr',p:'R',l:'Session Q/R de groupe avec Émilie',f:'mo',n:2,m:1},
  {id:'photo',p:'R',l:'Photo ou mesures de progression',f:'mo',n:1,m:2},
  {id:'relire',p:'R',l:'Relire mes victoires du mois',f:'mo',n:1,m:2}
];
const JALONS=[
  {id:'quest',l:'Questionnaire fonctionnel rempli'},
  {id:'sang',l:'Bilan sanguin réalisé'},
  {id:'appel',l:'Appel bilan individuel avec Émilie'},
  {id:'protocole',l:'Protocole personnalisé reçu et lu'},
  {id:'audit_sdb',l:'Audit de ma salle de bain'},
  {id:'audit_menage',l:'Audit de mes produits d’entretien'},
  {id:'bilan90',l:'Bilan de fin des 90 jours'}
];
const RESSENTI=[
  {id:'energie',l:'Énergie',lo:'Vidée',hi:'En forme',color:'#008038'},
  {id:'sommeil',l:'Sommeil de la nuit',lo:'Agité',hi:'Réparateur',color:'#294f42'},
  {id:'stress',l:'Stress du jour',lo:'À cran',hi:'Détendue',color:'#e07400'},
  {id:'humeur',l:'État d\u2019esprit',lo:'Moral en berne',hi:'Bien dans ma tête',color:'#87634a'}
];
const HB={};HABITS.forEach(h=>HB[h.id]=h);
const REPAS=[{id:'pdj',l:'Matin',ph:'Petit-déjeuner'},{id:'dej',l:'Midi',ph:'Déjeuner'},{id:'diner',l:'Soir',ph:'Dîner'},{id:'autre',l:'Autre',ph:'Collation, grignotage, boisson'}];

/* ---------- Dates ---------- */
const DAY=864e5;
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(k,n)=>key(new Date(parse(k).getTime()+n*DAY+36e5*2)); /* +2h : passage heure d'été */
const todayKey=()=>key(new Date());
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/DAY);
const weekStart=k=>{const d=parse(k);const w=(d.getDay()+6)%7;return addDays(k,-w);};
const monthKey=k=>k.slice(0,7);
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const fmtLong=k=>{const d=parse(k);return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()];};
const fmtShort=k=>{const d=parse(k);return d.getDate()+' '+MOIS[d.getMonth()].slice(0,4)+'.';};

/* ---------- État ---------- */
let S=null, view='jour', cur=todayKey(), weekCur=weekStart(todayKey());
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);}}catch(e){S=null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function fresh(prenom,start){return {prenom:prenom||'',start:start||todayKey(),fenetre:'22h30',options:{},unlockAll:false,days:{},jalons:{},demo:false};}
function day(k){if(!S.days[k])S.days[k]={done:{}};return S.days[k];}
function dayNumber(k){return diffDays(S.start,k)+1;}
function moisActuel(k){const n=dayNumber(k);return n<1?1:Math.min(3,Math.floor((n-1)/30)+1);}
function unlocked(h,k){if(h.socle)return true;if(S.unlockAll)return true;return (h.m||1)<=moisActuel(k);}
function active(h,k){return h.socle||(S.options[h.id]&&unlocked(h,k));}
function activeList(k){return HABITS.filter(h=>active(h,k));}
function periodCount(h,k){
  /* nombre de fois faite sur la période (semaine ou mois) */
  let keys=[];
  if(h.f==='w'){const ws=weekStart(k);for(let i=0;i<7;i++)keys.push(addDays(ws,i));}
  else{const mk=monthKey(k);keys=Object.keys(S.days).filter(x=>monthKey(x)===mk);}
  return keys.filter(x=>S.days[x]&&S.days[x].done[h.id]).length;
}
function completion(k){
  const list=activeList(k).filter(h=>h.f==='d');const d=S.days[k];
  if(!list.length)return 0;const n=list.filter(h=>d&&d.done[h.id]).length;return n/list.length;
}
function socleCompletion(k){const d=S.days[k];const list=HABITS.filter(h=>h.socle);return list.filter(h=>d&&d.done[h.id]).length/list.length;}
function streak(){
  let k=todayKey();if(completion(k)<.5)k=addDays(k,-1);
  let n=0;while(S.days[k]&&completion(k)>=.5&&dayNumber(k)>=1){n++;k=addDays(k,-1);if(n>400)break;}
  return n;
}

/* ---------- Données de démonstration ---------- */
function seedDemo(){
  const s=fresh('Sophie',addDays(todayKey(),-11));
  s.demo=true;s.fenetre='22h30';
  s.options={eau:true,cafe:true,lumiere:true,miroir:true,plaisir:true,qr:true,plan30:true};
  s.jalons={quest:true,sang:true,appel:true,protocole:true};
  let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const vict=['Réveil sans réveil, une première.','Pas de grignotage devant la télé.','Marché avec Claire au lieu de scroller.','Une vraie pause déjeuner.','J’ai dit non à une réunion à 19 h.','Nuit complète sans réveil.','Petit-déj salé, et pas de coup de barre à 11 h.','J’ai osé la robe verte.','Cohérence cardiaque dans la voiture avant de rentrer.','Trois jours de suite sans café l’après-midi.','Je me suis regardée avec douceur ce matin.'];
  for(let i=0;i<12;i++){
    const k=addDays(s.start,i);const d={done:{}};
    const prog=i/11;
    HABITS.forEach(h=>{
      if(!(h.socle||s.options[h.id]))return;
      if(h.f==='mo'){if((h.id==='qr'&&(i===2||i===9)))d.done[h.id]=true;return;}
      if(h.f==='w'){if(h.id==='plaisir'&&(i===5||i===10))d.done[h.id]=true;return;}
      const p=.45+prog*.45;if(rnd()<p)d.done[h.id]=true;
    });
    if(i<11||true){
      const b=1.6+prog*2.2;
      d.energie=Math.max(1,Math.min(5,Math.round(b+(rnd()-.5)*1.6)));
      d.sommeil=Math.max(1,Math.min(5,Math.round(b-.2+(rnd()-.5)*1.6)));
      d.stress=Math.max(1,Math.min(5,Math.round(b+.1+(rnd()-.5)*1.4)));
      d.humeur=Math.max(1,Math.min(5,Math.round((d.stress+b)/2+(rnd()-.5)*1.2)));
      d.victoire=vict[i]||'';
      if(i===3||i===6)d.sos=1;
    }
    const menus={8:{pdj:'Café seulement, pas faim',dej:'Sandwich au bureau',diner:'Pâtes, un verre de vin',autre:'Biscuits à 17 h'},9:{pdj:'Œufs brouillés, avocat, thé',dej:'Poulet, quinoa, brocolis',diner:'Soupe de légumes, chèvre frais'},10:{pdj:'Yaourt grec, noix, myrtilles',dej:'Salade de lentilles, saumon',diner:'Omelette aux champignons, salade',autre:'Un carré de chocolat noir à 16 h'},11:{pdj:'Pain complet, œuf à la coque, thé'}};
    if(menus[i])d.repas=menus[i];
    if(i===11){delete d.energie;delete d.sommeil;delete d.stress;delete d.humeur;d.victoire='';d.done={pdj:true,proto:true,lumiere:true,aerer:true};}
    s.days[k]=d;
  }
  return s;
}

function insightCard(){
  const tk=todayKey(),keys=[];for(let i=13;i>=0;i--)keys.push(addDays(tk,-i));
  const rows=keys.map(k=>S.days[k]).filter(d=>d&&d.stress&&d.humeur&&d.energie&&d.sommeil);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const f=v=>v===null?'\u2013':v.toFixed(1).replace('.',',');
  /* on compare les jours au-dessus et en dessous de la moyenne personnelle de la cliente */
  const pair=(by,dim)=>{const m=avg(rows.map(d=>d[by]));const a=rows.filter(d=>d[by]>m),b=rows.filter(d=>d[by]<=m);return {a:avg(a.map(d=>d[dim])),b:avg(b.map(d=>d[dim])),na:a.length,nb:b.length};};
  const s1=pair('stress','humeur');   /* jours plus détendus que d'habitude : état d'esprit */
  const s2=pair('sommeil','energie'); /* nuits meilleures que d'habitude : énergie */
  let h='<div class="card soft"><h2>Ce que mes 14 jours montrent</h2>';
  if(rows.length<4){h+='<p class="small">Remplis tes quatre curseurs chaque jour. À partir de quelques jours, cette carte relie ton stress, ton sommeil, ton énergie et ton état d\u2019esprit.</p></div>';return h;}
  const line=(t,p,lo,hi)=>{
    if(p.na<2||p.nb<2)return '<p class="small">'+t+' : pas encore assez de jours pour comparer.</p>';
    return '<div class="row between" style="align-items:flex-start"><div class="grow"><b>'+t+'</b><div class="small muted">'+lo+' : <b>'+f(p.b)+'</b> sur 5 · '+hi+' : <b>'+f(p.a)+'</b> sur 5</div></div></div>';
  };
  h+=line('État d\u2019esprit selon le stress',s1,'jours plus tendus','jours plus détendus');
  h+=line('Énergie selon la nuit',s2,'nuits moins bonnes','meilleures nuits');
  h+='<p class="small muted">Le stress pèse sur la journée, le sommeil sur l\u2019énergie. Ce que tu apaises le soir, tu le retrouves le lendemain.</p></div>';
  return h;
}
function chart(r){
  const tk=todayKey(),N=14,keys=[];for(let i=N-1;i>=0;i--)keys.push(addDays(tk,-i));
  const W=320,H=88,pl=16,pr=30,pt=8,pb=18;
  const x=i=>pl+i*(W-pl-pr)/(N-1),y=v=>pt+(5-v)*(H-pt-pb)/4;
  let g='';[1,3,5].forEach(v=>{g+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="lbl" x="'+(pl-4)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'</text>';});
  let path='',pts='',prev=false,last=null,area='';
  keys.forEach((k,i)=>{
    const v=S.days[k]&&S.days[k][r.id];
    if(v){path+=(prev?' L':' M')+x(i)+' '+y(v);prev=true;last={i,v,k};pts+='<circle class="pt" cx="'+x(i)+'" cy="'+y(v)+'" r="4" fill="'+r.color+'"><title>'+r.l+' : '+v+' sur 5, '+fmtShort(k)+'</title></circle>';}
    else prev=false;
  });
  let lastTxt='';
  if(last){lastTxt='<circle cx="'+x(last.i)+'" cy="'+y(last.v)+'" r="6" fill="'+r.color+'" class="pt"/><text class="last" x="'+(x(last.i)+10)+'" y="'+(y(last.v)+4)+'">'+last.v+'</text>';}
  const lab='<text class="lbl" x="'+pl+'" y="'+(H-4)+'">'+fmtShort(keys[0])+'</text><text class="lbl" x="'+(W-pr)+'" y="'+(H-4)+'" text-anchor="end">aujourd’hui</text>';
  const avg=(()=>{const vs=keys.map(k=>S.days[k]&&S.days[k][r.id]).filter(Boolean);return vs.length?(vs.reduce((a,b)=>a+b,0)/vs.length).toFixed(1).replace('.',','):'–';})();
  return '<div class="chart"><div class="ch"><h3>'+r.l+'</h3><span class="small muted">moyenne '+avg+' sur 5</span></div><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+r.l+' sur 14 jours">'+g+'<path class="line" d="'+path.trim()+'" stroke="'+r.color+'"/>'+pts+lastTxt+lab+'</svg></div>';
}

  /* jalons */
  h+='<div class="card"><h2>Révéler : mes jalons</h2><p class="small muted">Les étapes qui se font une fois, avec Émilie.</p><div>';
  JALONS.forEach(j=>{const on=!!S.jalons[j.id];h+='<button class="hab '+(on?'done':'')+'" style="border-radius:10px;margin-bottom:6px" data-act="jalon" data-id="'+j.id+'" aria-pressed="'+on+'"><span class="box">'+ICON.check+'</span><span class="lbl">'+esc(j.l)+'</span></button>';});
  h+='</div></div>';

  /* rituels du mois */
  const mo=activeList(tk).filter(x=>x.f==='mo');
  if(mo.length){
    h+='<div class="card"><h2>Ce mois-ci</h2>';
    mo.forEach(x=>{const c=periodCount(x,tk);h+='<div class="row between"><span class="grow">'+esc(x.l)+'</span><span class="chip '+(c>=x.n?'ok':'')+'">'+c+' / '+x.n+'</span></div>';});
    h+='</div>';
  }

  /* mur des victoires */
  const v=Object.keys(S.days).filter(k=>S.days[k].victoire).sort().reverse();
  h+='<div class="card"><div class="row between"><h2>Mon mur de victoires</h2><span class="chip ok">'+v.length+'</span></div>';
  if(!v.length)h+='<p class="small muted">Chaque soir, note une chose dont tu es fière. Elles s’affichent ici.</p>';
  v.slice(0,30).forEach(k=>{h+='<div class="victoire"><span class="d">'+fmtShort(k)+'</span><span>'+esc(S.days[k].victoire)+'</span></div>';});
  h+='</div>';
  return h;
}

/* --- Installation sur le téléphone --- */
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(S&&view==='reglages')render();});
function isStandalone(){try{return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}}
function installCard(){
  if(isStandalone())return '<div class="card soft"><h3>Application installée</h3><p class="small">Tu l\u2019ouvres depuis l\u2019icône REMAEDE sur ton écran d\u2019accueil.</p></div>';
  if(location.protocol==='file:'||window.top!==window)return '';
  const ua=navigator.userAgent||'';const ios=/iPhone|iPad|iPod/.test(ua);
  let h='<div class="card soft"><h3>Installer sur mon téléphone</h3>';
  if(installPrompt)h+='<p class="small">Une icône REMAEDE sur ton écran d\u2019accueil, comme une vraie application.</p><button class="btn primary" data-act="install">Installer l\u2019application</button>';
  else if(ios)h+='<p class="small">Dans Safari, touche le bouton Partager (le carré avec une flèche), puis « Sur l\u2019écran d\u2019accueil ». Tu auras l\u2019icône REMAEDE comme une application.</p>';
  else h+='<p class="small">Dans le menu de ton navigateur (les trois points), choisis « Installer l\u2019application » ou « Ajouter à l\u2019écran d\u2019accueil ».</p>';
  return h+'</div>';
}

/* --- Réglages --- */
function viewReglages(){
  const tk=todayKey(),m=moisActuel(tk);
  let h=brandBar()+demoBanner();
  h+='<div class="card"><h2>Mon profil</h2><div class="field"><label for="prenom">Prénom</label><input class="input" id="prenom" value="'+esc(S.prenom)+'" data-act="prenom"></div>'+
  '<div class="field"><label for="start">Premier jour du programme</label><input class="input" id="start" type="date" value="'+S.start+'" data-act="start-date"></div>'+
  '<div class="field"><label for="fenetre">Ma fenêtre de coucher (définie avec Émilie)</label><input class="input" id="fenetre" value="'+esc(S.fenetre||'')+'" placeholder="22h30" data-act="fenetre"></div></div>';

  h+='<div class="card"><h2>Mes options</h2><p class="small muted">Le socle de 8 habitudes est le même pour toutes. Les options sont choisies avec Émilie et se débloquent au fil des mois.</p>';
  h+='<button class="toggle '+(S.unlockAll?'on':'')+'" data-act="unlock" aria-pressed="'+!!S.unlockAll+'"><span class="sw"></span><span class="t">Débloquer toutes les options<b>Sinon, mois '+m+' en cours : options des mois suivants verrouillées</b></span></button>';
  ['E','A','S','R'].forEach(p=>{
    h+='<div class="eyebrow" style="margin-top:10px">'+PILIERS[p].nom+'</div><div>';
    HABITS.filter(x=>x.p===p&&!x.socle).forEach(x=>{
      const ok=unlocked(x,tk),on=!!S.options[x.id];
      const freq=x.f==='d'?'chaque jour':x.f==='w'?x.n+' fois par semaine':x.n+' fois par mois';
      h+='<button class="toggle '+(on&&ok?'on':'')+'" data-act="opt" data-id="'+x.id+'" '+(ok?'':'disabled')+' aria-pressed="'+(on&&ok)+'"><span class="sw"></span><span class="t">'+esc(x.l)+'<b>'+freq+(ok?'':' · disponible au mois '+x.m)+'</b></span>'+(ok?'':'<span class="chip lock">mois '+x.m+'</span>')+'</button>';
    });
    h+='</div>';
  });
  h+='</div>';

  h+=installCard();
  h+='<div class="card"><h2>Sauvegarde</h2><p class="small muted">Tes données restent sur cet appareil. Copie ce texte pour les garder ou les transférer sur un autre téléphone.</p>'+
  '<textarea class="input" id="backup" readonly>'+esc(JSON.stringify(S))+'</textarea>'+
  '<div class="row" style="flex-wrap:wrap">'+(window.top===window?'<button class="btn sm" data-act="download">Télécharger le fichier</button>':'')+'<button class="btn sm '+(window.top===window?'quiet':'')+'" data-act="copy">Copier le texte</button></div>'+
  '<div class="field"><label for="restore">Restaurer une sauvegarde</label><textarea class="input" id="restore" placeholder="Colle ici le texte de sauvegarde"></textarea></div>'+
  '<div class="row" style="flex-wrap:wrap"><button class="btn sm quiet" data-act="restore">Restaurer le texte</button><label class="btn sm quiet" for="restore-file">Restaurer un fichier<input type="file" id="restore-file" accept="application/json,.json" hidden></label><span class="grow"></span><button class="btn sm danger" data-act="reset">Tout effacer</button></div></div>';
  h+='<p class="small muted" style="text-align:center">Tracker de progression longévité · Méthode REMAEDE · Émilie Charles</p>';
  return h;
}

/* ---------- Interactions ---------- */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}
document.addEventListener('click',e=>{
  const nb=e.target.closest('#nav button');if(nb){view=nb.dataset.view;render(true);return;}
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT'||b.tagName==='TEXTAREA')return;
  const a=b.dataset.act;
  if(a==='start'){const p=$('#ob-prenom').value.trim();const s=$('#ob-start').value||todayKey();S=fresh(p,s);save();cur=todayKey();render(true);return;}
  if(a==='demo'){S=seedDemo();save();cur=todayKey();weekCur=weekStart(cur);view='jour';render(true);return;}
  if(a==='reset'){if(S.demo||confirm('Effacer toutes les données de ce téléphone ?')){try{localStorage.removeItem(KEY);}catch(x){}S=null;view='jour';render(true);}return;}
  if(a==='prev'){cur=addDays(cur,-1);render(true);return;}
  if(a==='next'){if(cur<todayKey()){cur=addDays(cur,1);render(true);}return;}
  if(a==='today'){cur=todayKey();render(true);return;}
  if(a==='wprev'){weekCur=addDays(weekCur,-7);render(true);return;}
  if(a==='wnext'){weekCur=addDays(weekCur,7);render(true);return;}
  if(a==='ress'){const d=day(cur);const v=+b.dataset.v;d[b.dataset.dim]=d[b.dataset.dim]===v?0:v;save();render();return;}
  if(a==='tog'){const d=day(cur);const id=b.dataset.id;d.done[id]=!d.done[id];if(!d.done[id])delete d.done[id];save();render();if(socleCompletion(cur)>=1&&d.done[id])toast('Socle du jour complet !');return;}
  if(a==='jalon'){const id=b.dataset.id;S.jalons[id]=!S.jalons[id];save();render();return;}
  if(a==='sos'){const d=day(cur);d.sos=(d.sos||0)+1;save();render();toast('Noté. Prends soin de toi.');return;}
  if(a==='unlock'){S.unlockAll=!S.unlockAll;save();render();return;}
  if(a==='opt'){const id=b.dataset.id;S.options[id]=!S.options[id];if(!S.options[id])delete S.options[id];save();render();return;}
  if(a==='copy'){const t=$('#backup');t.select();let ok=false;try{ok=document.execCommand('copy');}catch(x){}if(navigator.clipboard&&!ok){navigator.clipboard.writeText(t.value).then(()=>toast('Sauvegarde copiée'));}else toast(ok?'Sauvegarde copiée':'Sélectionne le texte et copie-le');return;}
  if(a==='copyrepas'){
    const days=[];for(let i=0;i<7;i++)days.push(addDays(weekCur,i));
    let t='Mes repas, semaine du '+fmtShort(days[0])+' au '+fmtShort(days[6])+(S.prenom?' ('+S.prenom+')':'')+'\n';
    days.forEach(k=>{const r=S.days[k]&&S.days[k].repas;if(!r||!REPAS.some(x=>r[x.id]))return;t+='\n'+fmtLong(k)+'\n';REPAS.forEach(x=>{if(r[x.id])t+='  '+x.l+' : '+r[x.id]+'\n';});});
    if(navigator.share){navigator.share({title:'Mes repas',text:t}).catch(()=>{});}else copyText(t);
    return;
  }
  if(a==='install'){if(installPrompt){installPrompt.prompt();installPrompt.userChoice.then(()=>{installPrompt=null;render();});}return;}
  if(a==='download'){
    const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const u=URL.createObjectURL(blob);
    const l=document.createElement('a');l.href=u;l.download='remaede-sauvegarde-'+todayKey()+'.json';document.body.appendChild(l);l.click();document.body.removeChild(l);setTimeout(()=>URL.revokeObjectURL(u),2000);
    toast('Fichier de sauvegarde téléchargé');return;
  }
  if(a==='restore'){try{const o=JSON.parse($('#restore').value);if(!o||!o.days)throw 0;S=o;S.demo=false;save();render();toast('Sauvegarde restaurée');}catch(x){toast('Texte de sauvegarde non reconnu');}return;}
});
function copyText(t){
  const done=()=>toast('Copié, tu peux le coller dans un message à Émilie');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallback());}else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(x){}document.body.removeChild(ta);toast(ok?'Copié, tu peux le coller dans un message à Émilie':'Copie impossible ici, ouvre l\u2019appli dans ton navigateur');}
}
document.addEventListener('change',e=>{
  if(e.target.id==='restore-file'){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.days)throw 0;S=o;S.demo=false;save();render();toast('Sauvegarde restaurée');}catch(x){toast('Fichier de sauvegarde non reconnu');}};r.readAsText(f);return;}
  const i=e.target.closest('[data-act]');if(!i)return;const a=i.dataset.act;
  if(a==='repas'){const d=day(cur);d.repas=d.repas||{};d.repas[i.dataset.slot]=i.value.trim();if(!d.repas[i.dataset.slot])delete d.repas[i.dataset.slot];save();return;}
  if(a==='victoire'){day(cur).victoire=i.value.trim();save();if(i.value.trim())toast('Victoire notée');return;}
  if(a==='prenom'){S.prenom=i.value.trim();save();return;}
  if(a==='start-date'){if(i.value){S.start=i.value;save();render();}return;}
  if(a==='fenetre'){S.fenetre=i.value.trim();save();return;}
});
document.addEventListener('input',e=>{const t=e.target;if(t.tagName==='TEXTAREA'&&t.dataset.act==='repas'){t.style.height='auto';t.style.height=t.scrollHeight+'px';}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='victoire')e.target.blur();});

/* ---------- Démarrage ---------- */
load();
cur=todayKey();weekCur=weekStart(cur);
render();
</script>
